name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Wails on Linux links GTK 4 and WebKitGTK 6.0 through cgo.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -ts

      # The Go package embeds frontend/dist, so the frontend is built before
      # the Go tests run. tsc runs as part of the build script.
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Go vet
        run: go vet ./...

      # The race detector needs cgo: built in on macOS, installed above on Linux.
      - name: Go tests (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Go tests
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Build app
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: personalrag-${{ runner.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 14
