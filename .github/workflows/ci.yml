name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -ts

      # The Go package embeds frontend/dist, so the frontend is built before
      # the Go tests run. tsc runs as part of the build script.
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet $(go list ./... | grep -v /build/)

      # The race detector needs cgo, which the macOS runner has out of the box.
      - name: Go tests (race)
        if: runner.os == 'macOS'
        run: go test -race $(go list ./... | grep -v /build/)

      - name: Go tests
        if: runner.os != 'macOS'
        run: go test $(go list ./... | grep -v /build/)

      - name: Build app
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: personalrag-${{ runner.os }}
          path: bin/
          if-no-files-found: error
          retention-days: 14
