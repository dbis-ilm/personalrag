- id: skript-pruefungsfragen
  folder: skript
  mode: agent
  question: Erstelle 5 Prüfungsfragen mit Musterlösungen zu Kapitel 3 des Vorlesungsskripts Database Systems.
  expect:
    concepts:
    - - ACID
    - - serializab
      - serialisierbar
    - - two-phase locking
      - Zwei-Phasen-Sperr
      - 2PL
    - - deadlock
      - Verklemmung
    - - wait-for
      - Wartegraph
    - - isolation level
      - Isolationsstufe
      - Isolationslevel
    - - write-ahead
      - WAL
    - - undo
      - redo
    - - conflict graph
      - precedence graph
      - Konfliktgraph
    min_concepts: 4
    excludes:
    - B+-
    - ANSI/SPARC
    - hash join
    - Normalform
    - normal form
    - two-phase commit
    - Zwei-Phasen-Commit
    - 2PC
    min_questions: 5
  note: The notes are in English, the task in German. Chapter 3 is about transactions; terms from other chapters (B+-trees, normal forms, two-phase commit) must not appear.
