<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full icon for .icns and .ico: Apple's 824 px squircle on a 1024 canvas,
       PersonalRAG blue, the glyph scaled into it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3468D8"/>
      <stop offset="1" stop-color="#1D3F95"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.86) translate(-512 -506)">
    <image href="glyph.svg" x="0" y="0" width="1024" height="1024"/>
  </g>
</svg>
